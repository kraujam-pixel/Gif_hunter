name: gif_hunter
description: "Search and browse GIFs from the Giphy API."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  rxdart: ^0.27.7

  # Networking & connectivity
  dio: ^5.11.1
  connectivity_plus: ^7.3.2

  # Navigation & dependency injection
  go_router: ^18.1.3
  get_it: ^9.3.0

  # UI
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
